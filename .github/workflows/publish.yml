name: Build and Publish ABox
on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/publish.yml'
      - 'config/editors.json'
      - 'bin/abx'
      - 'docker/**'
      - 'Makefile'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      editors_json:
        description: 'JSON array of editors to build (e.g. ["claude", "vibe"])'
        required: false
        default: ''
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: r-dson/abox
  # Defines the fallback list
  ALL_EDITORS: '["opencode", "claude", "aider", "copilot", "vibe", "goose", "codex", "gemini", "cursor"]'

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix_editors: ${{ steps.set-matrix.outputs.editors }}
    steps:
      - name: Determine Matrix
        id: set-matrix
        run: |
          INPUT_JSON='${{ inputs.editors_json }}'
          
          if [[ -n "$INPUT_JSON" && "$INPUT_JSON" != "[]" ]]; then
            echo "Received specific editors to build: $INPUT_JSON"
            echo "editors=$INPUT_JSON" >> $GITHUB_OUTPUT
          else
            echo "No input list provided. Building ALL editors."
            echo 'editors=${{ env.ALL_EDITORS }}' >> $GITHUB_OUTPUT
          fi

  publish-images:
    needs: [setup-matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        editor: ${{ fromJson(needs.setup-matrix.outputs.matrix_editors) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Load editor config
        id: config
        run: |
          EDITOR="${{ matrix.editor }}"
          
          VERSION=$(jq -r ".editors.\"$EDITOR\".version" config/editors.json)
          INSTALL_RAW=$(jq -r ".editors.\"$EDITOR\".install_cmd" config/editors.json)
          INSTALL=${INSTALL_RAW//"{version}"/$VERSION}
          CMD=$(jq -r ".editors.\"$EDITOR\".cmd_name" config/editors.json)
          
          echo "install<<EOF" >> $GITHUB_OUTPUT
          echo "$INSTALL" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "cmd=$CMD" >> $GITHUB_OUTPUT
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ matrix.editor }}
            type=raw,value=${{ matrix.editor }}-${{ steps.config.outputs.version }}
            type=semver,pattern={{version}},suffix=-${{ matrix.editor }}
            type=sha,suffix=-${{ matrix.editor }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            INSTALL_CMD=${{ steps.config.outputs.install }}
            VERSION=${{ steps.config.outputs.version }}
            COMMAND_NAME=${{ steps.config.outputs.cmd }}

  release:
    needs: [publish-images]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: bin/abx
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Latest Build (Main)' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup-untagged:
    needs: publish-images
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      max-parallel: 1
      matrix:
        editor: [opencode, claude, aider, copilot, vibe, goose, codex, gemini, cursor]
    steps:
      - name: Clean up old ${{ matrix.editor }} images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package: abox
          delete-tags: "sha-*-${{ matrix.editor }}"
          keep-n-tagged: 3
          delete-untagged: true
