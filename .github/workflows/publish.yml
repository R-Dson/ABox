name: Build and Publish ABox
on:
  push:
    branches:
      - main
    paths:
      - 'VERSIONS.yaml'
      - 'bin/abx'
      - 'docker/**'
      - 'Makefile'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: r-dson/abox
jobs:
  build-binary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build binary
        run: make build
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: abx-binary
          path: bin/abx

  publish-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        editor: [opencode, claude, aider, copilot, vibe, goose, codex, gemini, cursor]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Load editor config
        id: config
        run: |
          EDITOR="${{ matrix.editor }}"
          INSTALL=$(yq ".editors.$EDITOR.install" docker/editors.yaml)
          VERSION=$(yq ".$EDITOR" VERSIONS.yaml)
          CMD=$(yq ".editors.$EDITOR.cmd" docker/editors.yaml)
          
          # Handle null/empty values
          [[ "$INSTALL" == "null" ]] && INSTALL=""
          [[ "$VERSION" == "null" ]] && VERSION=""
          [[ "$CMD" == "null" ]] && CMD="opencode"
          
          echo "install=$INSTALL" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "cmd=$CMD" >> $GITHUB_OUTPUT
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ matrix.editor }}
            type=raw,value=${{ matrix.editor }}-${{ steps.config.outputs.version }}
            type=semver,pattern={{version}},suffix=-${{ matrix.editor }}
            type=sha,suffix=-${{ matrix.editor }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            INSTALL_CMD=${{ steps.config.outputs.install }}
            VERSION=${{ steps.config.outputs.version }}
            COMMAND_NAME=${{ steps.config.outputs.cmd }}

  release:
    needs: [build-binary, publish-images]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: abx-binary
          path: bin/
      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: bin/abx
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Latest Build (Main)' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
