name: Release

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/release.yml"
      - "cmd/**"
      - "internal/**"
      - "config/**"
      - "go.mod"
      - "go.sum"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod }

      - name: Build binaries
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/abx_linux_amd64 ./cmd/abx
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/abx_linux_arm64 ./cmd/abx
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/abx_darwin_amd64 ./cmd/abx
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/abx_darwin_arm64 ./cmd/abx

      - name: Generate checksums
        run: cd dist && sha256sum * > checksums.txt

      - name: Update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build"
          body: "Auto-built from main (${{ github.sha }})"
          prerelease: false
          generate_release_notes: false
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
