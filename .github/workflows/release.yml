name: Release

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/release.yml"
      - "cmd/**"
      - "internal/**"
      - "config/**"
      - "go.mod"
      - "go.sum"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod }

      - name: Build binaries
        run: |
          mkdir -p dist
          SHORT_SHA="$(git rev-parse --short HEAD)"
          LDFLAGS="-s -w -X main.commit=${SHORT_SHA}"
          CGO_ENABLED=0 GOOS=linux  GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/abx_linux_amd64  ./cmd/abx
          CGO_ENABLED=0 GOOS=linux  GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o dist/abx_linux_arm64  ./cmd/abx
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/abx_darwin_amd64 ./cmd/abx
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o dist/abx_darwin_arm64 ./cmd/abx

      - name: Generate checksums
        run: cd dist && sha256sum -- * > checksums.txt

      - name: Delete old release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest"
          REPO="${{ github.repository }}"
          # Fetch current assets and delete them
          ASSETS=$(gh release view "$TAG" --repo "$REPO" --json assets -q '.assets[].name' 2>/dev/null || true)
          for asset in $ASSETS; do
            gh release delete-asset "$TAG" "$asset" --repo "$REPO" --yes 2>/dev/null || true
          done

      - name: Move latest tag to current commit
        run: |
          git tag -f latest HEAD
          git push origin latest --force

      - name: Update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build"
          body: "Auto-built from main (${{ github.sha }})"
          prerelease: false
          generate_release_notes: false
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
