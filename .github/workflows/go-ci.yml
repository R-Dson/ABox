name: Go CI

on:
  push:
    branches: [main, dev, go-rewrite]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify dependencies
        run: go mod verify
      - name: Run linter
        run: go tool golangci-lint run ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run tests
        run: |
          # Exclude packages that require live Docker daemon or are trivially small
          go test -race -coverprofile=coverage.out \
            $(go list ./... | grep -v -E '(cmd/abx$|internal/runtime$)')
      - name: Check coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          # cmd/abx (main only) and runtime (Docker SDK calls) excluded —
          # they require a live container daemon and cannot be unit-tested.
          if (( $(echo "$COVERAGE < 70" | bc -l) )); then
            echo "Coverage ${COVERAGE}% is below 70% threshold"
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build binary
        run: go build -trimpath -ldflags="-s -w" ./cmd/abx
      - name: Verify binary runs
        run: ./abx version
