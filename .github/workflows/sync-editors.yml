name: Sync Editor Versions

on:
  schedule:
    - cron: '*/15 * * * *'  # Run every 10 minutes
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write  # Needed to trigger the publish workflow
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Sync versions
        run: python scripts/sync_versions.py

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code VERSIONS.yaml || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Detect Changed Editors
        id: detect
        if: steps.git-check.outputs.changed == 'true'
        run: |         
          CHANGED_LIST=$(git diff -U0 VERSIONS.yaml | grep -E "^\+[a-z]" | cut -d: -f1 | sed 's/^+//' | jq -R . | jq -s -c .)
          echo "Detected changes: $CHANGED_LIST"
          echo "editors=$CHANGED_LIST" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add VERSIONS.yaml
          git commit -m "chore: update editor versions"
          git push

      - name: Trigger Build Workflow
        if: steps.git-check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CHANGES='${{ steps.detect.outputs.editors }}'
          echo "Triggering build for: $CHANGES"
          gh workflow run publish.yml \
            --ref main \
            -f editors_json="$CHANGES"
