name: Sync Editor Versions

on:
  schedule:
    - cron: '*/15 * * * *'  # Run every 15 minutes
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write  # Needed to trigger the publish workflow
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync versions
        run: uv run scripts/sync_versions.py

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code config/editors.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Detect Changed Editors
        id: detect
        if: steps.git-check.outputs.changed == 'true'
        run: |
          CHANGED_EDITORS=$(jq -n \
            --argjson old "$(git show HEAD:config/editors.json | jq .editors)" \
            --argjson new "$(cat config/editors.json | jq .editors)" \
            '$new | to_entries | .[] | select(.value != $old[.key]) | .key' \
            | jq -s -c .)

          echo "Detected changes: $CHANGED_EDITORS"
          echo "editors=$CHANGED_EDITORS" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add config/editors.json
          git commit -m "chore: update editor versions [skip ci]"
          git push

      - name: Trigger Build Workflow
        if: steps.git-check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CHANGES='${{ steps.detect.outputs.editors }}'
          echo "Triggering build for: $CHANGES"
          gh workflow run publish.yml \
            --ref main \
            -f editors_json="$CHANGES"
