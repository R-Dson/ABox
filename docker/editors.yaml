editors:
  opencode:
    install: "curl -fsSL https://opencode.ai/install | bash -s -- --version $VERSION && mv /root/.opencode/bin/opencode /usr/local/bin/opencode && rm -rf /root/.opencode"
    cmd: "opencode"
  claude:
    install: "curl -fsSL https://claude.ai/install.sh | bash && mv /root/.local/bin/claude /usr/local/bin/claude 2>/dev/null || mv /root/bin/claude /usr/local/bin/claude"
    cmd: "claude"
  aider:
    install: "curl -LsSf https://aider.chat/install.sh | sh && mv /root/.local/bin/aider /usr/local/bin/aider"
    cmd: "aider"
  copilot:
    install: "export VERSION=$VERSION PREFIX=/usr/local && curl -fsSL https://gh.io/copilot-install | bash"
    cmd: "copilot"
  vibe:
    install: "curl -LsSf https://mistral.ai/vibe/install.sh | bash && mv /root/.local/bin/vibe /usr/local/bin/vibe"
    cmd: "vibe"
  goose:
    install: "export GOOSE_VERSION=$VERSION && curl -fsSL https://github.com/block/goose/releases/download/stable/download_cli.sh | bash && mv /root/.local/bin/goose /usr/local/bin/goose"
    cmd: "goose"
  codex:
    install: "npm i -g @openai/codex"
    cmd: "codex"
  gemini:
    install: "npm install -g @google/gemini-cli"
    cmd: "gemini"
  cursor:
    install: "curl https://cursor.com/install -fsS | bash && mv /root/.local/bin/cursor /usr/local/bin/cursor"
    cmd: "cursor"
