version: 2

builds:
  - main: ./cmd/abx
    binary: abx
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: tarball
    name_template: "abx_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
  - id: binary
    name_template: "abx_{{ .Os }}_{{ .Arch }}"
    format: binary

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: R-Dson
    name: ABox
  replace_existing_artifacts: false
  prerelease: auto
