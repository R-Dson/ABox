version: 2

builds:
  - main: ./cmd/abx
    binary: abx
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format: tar.gz

checksum:
  name_template: "checksums.txt"

signs:
  - artifacts: checksum
    args: ["--batch", "-u", "{{ .Env.GPG_FINGERPRINT }}", "--output", "${signature}", "--detach-sign", "${artifact}"]

sboms:
  - artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: R-Dson
    name: ABox

brews:
  - repository:
      owner: R-Dson
      name: homebrew-tap
    directory: Formula
    homepage: "https://github.com/R-Dson/ABox"
    description: "Secure AI coding editor sandbox"
    test:
      system "#{bin}/abx version"
    install: |
      bin.install "abx"
